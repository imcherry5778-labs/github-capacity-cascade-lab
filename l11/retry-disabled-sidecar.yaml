apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: auth-sim-inbound-retry-disabled
  namespace: capacity-cascade-l11-sidecar
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: auth-sim
      app.kubernetes.io/instance: auth-sim-sidecar
  configPatches:
    - applyTo: VIRTUAL_HOST
      match:
        context: SIDECAR_INBOUND
        routeConfiguration:
          name: inbound|8080||
          vhost:
            name: inbound|http|8080
      patch:
        # Istio 1.30.4 HTTP_ROUTE does not implement REPLACE. Replacing this exact
        # inbound virtual host preserves its one route without retry_policy. This
        # mirrors L04's version-specific fallback; L11 does not reuse L04's file so
        # that unit stays untouched, and this patch is never applied to the ambient
        # ztunnel scenario or to any waypoint (L11 has no waypoint).
        operation: REPLACE
        value:
          name: inbound|http|8080
          domains:
            - "*"
          routes:
            - name: default
              match:
                prefix: /
              route:
                cluster: inbound|8080||
                timeout: 0s
                max_stream_duration:
                  max_stream_duration: 0s
                  grpc_timeout_header_max: 0s
              decorator:
                operation: auth-sim-sidecar.capacity-cascade-l11-sidecar:8080/*

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-sim-scaling
  namespace: TARGET_NAMESPACE
  labels:
    capacity-cascade-lab/owner: l09
    capacity-cascade-lab/policy: blind-application-cpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-sim
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: auth-sim
        target:
          type: Utilization
          averageUtilization: 80

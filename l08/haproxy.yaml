apiVersion: v1
kind: ConfigMap
metadata:
  name: l08-haproxy-config
  namespace: TARGET_NAMESPACE
  labels:
    capacity-cascade-lab/owner: l08
data:
  haproxy.cfg: |
    global
        log stdout format raw local0
        maxconn 200

    defaults
        mode http
        log global
        option httplog
        option http-keep-alive
        # Retry is off; Chaos fault is the single active variable.
        retries 0
        no option redispatch
        timeout connect 1s
        timeout client 3s
        timeout server 3s
        timeout queue 1s

    resolvers kubernetes
        parse-resolv-conf
        hold valid 10s

    frontend public
        bind :8080
        default_backend auth_sim

    frontend stats
        bind :8404
        stats enable
        stats uri /stats
        stats show-legends

    backend auth_sim
        # HAProxy is intentionally not the constrained component.
        server auth-sim AUTH_SIM_SERVICE_FQDN:8080 check resolvers kubernetes init-addr last,libc,none maxconn 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l08-haproxy
  namespace: TARGET_NAMESPACE
  labels:
    app.kubernetes.io/name: l08-haproxy
    capacity-cascade-lab/owner: l08
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: l08-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: l08-haproxy
        capacity-cascade-lab/owner: l08
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
      containers:
        - name: haproxy
          image: HAPROXY_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - {name: public, containerPort: 8080, protocol: TCP}
            - {name: stats, containerPort: 8404, protocol: TCP}
          readinessProbe:
            httpGet: {path: /stats, port: stats}
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /usr/local/etc/haproxy/haproxy.cfg, subPath: haproxy.cfg, readOnly: true}
      volumes:
        - name: config
          configMap: {name: l08-haproxy-config}
---
apiVersion: v1
kind: Service
metadata:
  name: l08-haproxy
  namespace: TARGET_NAMESPACE
  labels:
    app.kubernetes.io/name: l08-haproxy
    capacity-cascade-lab/owner: l08
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: l08-haproxy
  ports:
    - {name: public, port: 8080, targetPort: public, protocol: TCP}
    - {name: stats, port: 8404, targetPort: stats, protocol: TCP}

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: auth-sim-delay
  namespace: capacity-cascade-l08-target
  labels:
    app.kubernetes.io/name: auth-sim-delay
    capacity-cascade-lab/owner: l08
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - capacity-cascade-l08-target
    labelSelectors:
      app.kubernetes.io/name: auth-sim
      app.kubernetes.io/instance: auth-sim
  delay:
    latency: 600ms
    jitter: "0ms"
    correlation: "0"
  direction: to
  duration: 25s

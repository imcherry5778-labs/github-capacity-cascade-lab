apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: auth-sim-inbound-capacity
  namespace: capacity-cascade-l07-target
  labels:
    capacity-cascade-lab/owner: l07
spec:
  workloadSelector:
    labels:
      app.kubernetes.io/name: auth-sim
      app.kubernetes.io/instance: auth-sim
  ingress:
    - port: {number: 8080, protocol: HTTP, name: public}
      defaultEndpoint: 127.0.0.1:8080
      connectionPool:
        http:
          # A local capacity target reused from L05/L06, not a GitHub value.
          http2MaxRequests: 1

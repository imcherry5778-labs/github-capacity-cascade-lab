apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-sim-scaling
  namespace: capacity-cascade-l07-target
  labels:
    capacity-cascade-lab/owner: l07
    capacity-cascade-lab/policy: capacity-aware
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-sim
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - {type: Pods, value: 4, periodSeconds: 15}
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
  metrics:
    - type: Pods
      pods:
        metric:
          name: sidecar_active_requests
        target:
          type: AverageValue
          averageValue: 500m

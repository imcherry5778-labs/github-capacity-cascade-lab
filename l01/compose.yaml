services:
  auth-sim:
    image: ${AUTH_SIM_IMAGE:-capacity-cascade/auth-sim:dev}
    environment:
      LAB_PUBLIC_ADDR: 0.0.0.0:8080
      LAB_ADMIN_ADDR: 0.0.0.0:9090
      # Secret은 compose file에 값을 넣지 않고 runner process environment에서만 전달한다.
      LAB_ADMIN_TOKEN:
    ports:
      # Admin plane은 host loopback의 Docker 할당 port로만 접근한다.
      - "127.0.0.1::9090"

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:3.2.23-alpine}
    depends_on:
      - auth-sim
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Workload와 read-only stats plane 모두 host loopback 밖으로 공개하지 않는다.
      - "127.0.0.1::8080"
      - "127.0.0.1::8081"
      - "127.0.0.1::8404"

  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.12.0}
    depends_on:
      - auth-sim
    ports:
      # Control API와 fault path는 실행별 동적 loopback port를 사용한다.
      - "127.0.0.1::8474"
      - "127.0.0.1::8666"

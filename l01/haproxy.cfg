global
    log stdout format raw local0
    maxconn 200

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    # L01은 proxy retry를 학습하지 않으므로 physical attempt 해석을 위해 명시적으로 끈다.
    retries 0
    no option redispatch
    timeout connect 1s
    timeout client 5s
    timeout server 5s
    timeout queue 1s

# Stats plane은 workload frontend와 분리하고 Compose가 host loopback에만 publish한다.
frontend l01_stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats show-legends

frontend l01_control
    bind :8080
    default_backend be_l01_control

backend be_l01_control
    # Control과 constrained는 같은 upstream/service time을 쓰고 HAProxy limit만 다르게 둔다.
    server auth_sim auth-sim:8080 maxconn 100 check init-addr last,libc,none

frontend l01_constrained
    bind :8081
    default_backend be_l01_constrained

backend be_l01_constrained
    # 이 값은 짧은 local queue 관찰을 위한 lab target이며 GitHub 설정이 아니다.
    timeout queue 100ms
    server auth_sim auth-sim:8080 maxconn 2 check init-addr last,libc,none
